name: Debian LV2 preview

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  bookworm:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: Prepare Debian build environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates cmake dpkg-dev file g++ git liblilv-dev lilv-utils lv2-dev ninja-build pkg-config python3 serdi sordi
          dpkg-query -W g++ cmake dpkg-dev liblilv-dev lv2-dev
      - uses: actions/checkout@v4
      - name: Build and test
        run: sh scripts/build.sh
      - name: Render licensed speech through LV2
        run: |
          python3 tests/audio/lv2_speech_test.py build-linux/lv2
          python3 tests/audio/lv2_restoration_test.py build-linux/lv2
      - name: Run sanitized DSP tests
        run: |
          cmake -S . -B build-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVOICEFORGE_LV2=OFF -DVOICEFORGE_SANITIZERS=ON
          cmake --build build-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitized --output-on-failure
      - name: Package and test installation
        run: |
          sh scripts/package.sh
          dpkg -i dist/*.deb
          dpkg -s voiceforge-lv2
          build-linux/voiceforge_host_test /usr/lib/lv2
          stage=$(mktemp -d)
          export HOME="$stage/home"
          mkdir "$HOME"
          tar xzf dist/voiceforge-lv2-linux-amd64.tar.gz -C "$stage"
          sh "$stage/install.sh"
          sh "$stage/install.sh"
          build-linux/voiceforge_host_test "$HOME/.lv2"
          sh "$stage/uninstall.sh"
          test ! -e "$HOME/.lv2/voiceforge.lv2"
      - name: Verify installed plugin in Debian Ardour
        run: |
          apt-get install -y --no-install-recommends ardour
          dpkg-query -W ardour
          stage=$(mktemp -d)
          export HOME="$stage/home" XDG_CONFIG_HOME="$stage/config" LV2_PATH=/usr/lib/lv2
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          export VOICEFORGE_ARDOUR_SESSION="$stage/VoiceForgeQA"
          timeout 30 ardour7-lua tests/integration/ardour_smoke.lua > "$stage/create.log" 2>&1 || { cat "$stage/create.log"; exit 1; }
          cat "$stage/create.log"
          grep -Fx 'VoiceForge Ardour session created' "$stage/create.log"
          test -s "$VOICEFORGE_ARDOUR_SESSION/VoiceForgeQA.ardour"
          VOICEFORGE_ARDOUR_REOPEN=1 timeout 30 ardour7-lua tests/integration/ardour_smoke.lua > "$stage/reopen.log" 2>&1 || { cat "$stage/reopen.log"; exit 1; }
          cat "$stage/reopen.log"
          grep -Fx 'VoiceForge Ardour session restored' "$stage/reopen.log"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceforge-lv2-debian-bookworm-amd64-preview
          path: |
            dist/*.deb
            dist/*.tar.gz
            build-linux/runtime-dependencies.txt
          if-no-files-found: error
